name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please don't paste passwords, tokens, cookies or conversation text.
        Security problems go to the private report form instead: see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you see, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Connect Codex with web login\n2. …"
  - type: input
    id: version
    attributes:
      label: AI Usage version
      description: Settings → bottom line, e.g. 1.2.1
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac
      placeholder: macOS 15.3, Apple Silicon
  - type: dropdown
    id: connection
    attributes:
      label: Connection
      multiple: true
      options: [Claude (web), Claude (Claude Code), Codex (web), Codex (Codex CLI)]
